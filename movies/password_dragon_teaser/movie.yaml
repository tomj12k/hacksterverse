  same small friendly learning robot, 2 feet 6 inches tall, childlike proportions,
  glossy white ceramic shell, rounded helmet-like head, smooth dark glass LED face
  with expressive glowing cyan-blue eyes only and no mouth, one tiny antenna with
  glowing blue tip, blank blue hoodie, one plain circular glowing cyan Core Crystal
  centered on the chest, compact floating magnetic backpack, two simple rounded robot
  arms, two simple rounded robot legs, blank cuffs, blank chunky sneakers, child-friendly
  rounded shapes, no dangling cords or straps. Niko is never an animal, never a mascot
  suit, never furry, never reptilian, never dragon-like, never fox-like, and never
  has a tail, wings, ears, snout, claws, paws, horns, scales, feathers, fur, organic
  limbs, or extra appendages.'
global_visual_style: premium children's picture book illustration, bright and warm,
  rounded friendly shapes, soft cinematic lighting, saturated colors, whimsical cyber
  forest, expressive characters, no realistic weapons, no scary imagery, no text baked
  into image, no letters, no captions, no UI, leave clean open space for editable
