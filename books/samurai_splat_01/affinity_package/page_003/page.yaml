scene_title: Meet Shotgun Bob
story_text: Samurai Splat stood on the soft training mat, trying to balance on one
  foot. 'I must master my footing!' he declared dramatically. 'You're wobblin' like
  a noodle in a typhoon!' laughed Shotgun Bob, tossing a rice ball to Splat. 'Eh,
  just grab the pole and practice!' 'But I must do it with grace and honor!' Splat
  protested, before immediately losing his balance.
