scene_title: The Village Parade
story_text: Samurai Splat stood at the front of the parade, determined to lead with
  dignity and grace. But his feet felt like noodles in his shiny new boots. 'You're
  overthinking it, Splat!' called Shotgun Bob, marching beside him with a goofy grin.
  'Just walk like a happy dumpling!'
