scene_title: The Balloon Juggling
story_text: Samurai Splat stood in the village square, determined to juggle the balloons.
  'This is a matter of balance and focus!' he declared. But the balloons floated away,
  no matter how hard he tried. 'Maybe you should just blow more air into them,' suggested
  Shotgun Bob. 'No, no! I must master this!', replied Samurai Splat.
