idea: Create a funny all-ages comic-strip picture book called Samurai Splat. Each
  short strip follows Samurai Splat, a dramatic but clumsy little samurai hero who
  tries to solve a tiny everyday problem with huge seriousness. His loyal friend Shotgun
  Bob gives very direct, goofy advice. Every strip ends with Samurai Splat slipping,
  tripping, overcommitting, or being surprised, and he goes “SPLAT!” The tone should
  be slapstick, playful, nonviolent, silly, and safe for kids. No weapons, no scary
  imagery, no injury realism, no mean-spirited jokes. Make it visually bold, expressive,
  and readable like a premium children’s comic-picture book.
focus_characters:
- Samurai Splat
- Shotgun Bob
- village people
focus_items:
- Soft training mat
- bamboo practice pole
- noodle bowl
- slippery rice ball
reference_notes: 'Use a bright premium children''s comic-picture-book style with rounded
  shapes, saturated colors, clean readable silhouettes, expressive poses, cinematic
  but playful lighting, and slapstick motion. Keep Samurai Splat 100% consistent across
  pages: same body shape, same outfit, same face proportions, same headband/helmet
  silhouette, same color palette. Keep Shotgun Bob consistent too. Do not bake dialogue
  or captions into the image; leave clean space for editable text layers. No guns,
  no blades, no scary violence, no realistic injury, no dark gritty samurai style.'
